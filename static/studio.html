<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工作台 · NeuroArchAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="nav-holder"></div>

  <main class="container" style="padding: 34px 0 60px">
    <h1 class="section-title">工作台</h1>
    <p class="muted small" style="margin-top: -10px">创建项目 → 上传户型图 → 生成 AI 设计方案</p>

    <!-- 新建项目 -->
    <div class="card" style="margin-top: 22px">
      <h2 style="margin: 0 0 16px; font-size: 18px">新建项目</h2>
      <form id="project-form">
        <div class="grid grid-2">
          <div class="field">
            <label for="p-title">项目名称 *</label>
            <input class="input" id="p-title" placeholder="例如：城南小区 120㎡ 三居" required />
          </div>
          <div class="field">
            <label for="p-area">建筑面积（㎡）</label>
            <input class="input" id="p-area" type="number" min="10" max="2000" step="0.1" placeholder="120" />
          </div>
          <div class="field">
            <label for="p-rooms">房间构成</label>
            <input class="input" id="p-rooms" placeholder="3室2厅1卫" />
          </div>
          <div class="field">
            <label for="p-desc">备注</label>
            <input class="input" id="p-desc" placeholder="采光好、想扩大厨房…" />
          </div>
        </div>
        <button class="btn btn-primary" id="create-btn" type="submit">创建项目</button>
      </form>
    </div>

    <!-- 我的项目 -->
    <h2 class="section-title" style="margin-top: 34px">我的项目</h2>
    <div id="project-list" class="grid grid-3">
      <div class="empty">加载中…</div>
    </div>

    <!-- 项目详情面板 -->
    <section id="detail-panel" style="display: none; margin-top: 34px">
      <div class="between row wrap" style="margin-bottom: 16px">
        <h2 class="section-title" style="margin: 0" id="detail-title">项目详情</h2>
        <button class="btn btn-sm" onclick="closeDetail()">收起</button>
      </div>

      <div class="grid grid-2">
        <!-- 户型图 -->
        <div class="card">
          <h3 style="margin: 0 0 14px; font-size: 16px">户型图</h3>
          <div class="dropzone" id="dropzone">
            <p style="margin: 0">点击或拖拽图片到此处上传</p>
            <p class="muted small" style="margin: 6px 0 0">支持 PNG / JPG / WEBP，≤ 10MB</p>
            <div id="floorplan-preview"></div>
          </div>
          <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp" hidden />
        </div>

        <!-- 生成方案 -->
        <div class="card">
          <h3 style="margin: 0 0 14px; font-size: 16px">生成设计方案</h3>
          <form id="design-form">
            <div class="field">
              <label for="d-style">设计风格</label>
              <select class="select" id="d-style">
                <option>现代简约</option>
                <option>北欧</option>
                <option>新中式</option>
                <option>日式侘寂</option>
                <option>工业风</option>
                <option>轻奢</option>
                <option>奶油风</option>
              </select>
            </div>
            <div class="grid grid-2">
              <div class="field">
                <label for="d-area">面积（㎡）</label>
                <input class="input" id="d-area" type="number" min="10" max="2000" step="0.1" placeholder="沿用项目面积" />
              </div>
              <div class="field">
                <label for="d-level">预算档位</label>
                <select class="select" id="d-level">
                  <option value="economy">经济型</option>
                  <option value="standard" selected>标准型</option>
                  <option value="premium">品质型</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label for="d-req">额外需求</label>
              <textarea class="textarea" id="d-req" placeholder="例如：需要独立书房、喜欢原木风、在意收纳…"></textarea>
            </div>
            <button class="btn btn-primary" id="gen-btn" type="submit">生成方案 ✨</button>
          </form>
        </div>
      </div>

      <!-- 方案列表 -->
      <h3 style="margin: 28px 0 14px; font-size: 16px">该项目的设计方案</h3>
      <div id="design-list" class="grid grid-3">
        <div class="empty">暂无方案</div>
      </div>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/studio.js"></script>
</body>
</html>
